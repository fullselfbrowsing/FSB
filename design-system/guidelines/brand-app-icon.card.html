<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--primary); }
.app{display:flex;align-items:center;gap:18px;padding:18px 20px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-card)}
.app img{border-radius:12px;border:1px solid var(--border-color)}
.app b{font-size:.85rem;color:var(--text-primary);display:block}
</style>
</head>
<body>
<div class="app">
<img src="../assets/logos/icon128.png" alt="FSB app icon" width="60" height="60">
<img src="../assets/logos/icon48.png" alt="FSB app icon small" width="38" height="38">
<span><b>Extension icon</b><span class="lbl">128px &amp; 48px · pure black field</span></span>
</div>
</body>
</html>
