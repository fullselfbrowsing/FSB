<!-- @dsCard group="Type" viewport="700x170" subtitle="System UI, Poppins, platform mono" name="Families" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--primary); }
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fc{padding:18px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-card)}
.s{font-size:1.9rem;margin-bottom:10px;line-height:1;color:var(--text-primary)}
.fc b{font-size:.8rem;color:var(--text-primary)}
</style>
</head>
<body>
<div class="grid">
<div class="fc"><div class="s" style="font-family:var(--font-sans)">Ag</div><b>System UI</b><div class="lbl">everything readable</div></div>
<div class="fc"><div class="s" style="font-family:var(--font-brand);font-weight:100">Ag</div><b>Poppins</b><div class="lbl">100 / 900 — mark only</div></div>
<div class="fc"><div class="s" style="font-family:var(--font-mono)">Ag</div><b>Platform mono</b><div class="lbl">SF Mono, Monaco, Cascadia — code &amp; tokens</div></div>
</div>
</body>
</html>
