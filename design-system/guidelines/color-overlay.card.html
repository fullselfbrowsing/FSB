<!-- @dsCard group="Colors" viewport="700x300" subtitle="What FSB draws on web pages" name="Overlay palette" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--fsb-ov-accent); }
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.sw{border:1px solid var(--border-color);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-card)}
.fill{height:56px}
.m{padding:9px 11px;border-top:1px solid var(--border-color);display:flex;flex-direction:column;gap:2px}
.m b{font-size:.76rem;color:var(--text-primary);font-weight:600}
</style>
</head>
<body data-surface="overlay">
<div class="grid">
<div class="sw"><div class="fill" style="background:linear-gradient(90deg,var(--fsb-ov-thinking-1),var(--fsb-ov-thinking-2))"></div><div class="m"><b>Thinking</b><span class="var">--fsb-ov-thinking-1</span><span class="lbl">#ff8c00</span></div></div>
<div class="sw"><div class="fill" style="background:linear-gradient(90deg,var(--fsb-ov-acting-1),var(--fsb-ov-acting-2))"></div><div class="m"><b>Acting</b><span class="var">--fsb-ov-acting-1</span><span class="lbl">#ff6600</span></div></div>
<div class="sw"><div class="fill" style="background:linear-gradient(90deg,var(--fsb-ov-watching-1),var(--fsb-ov-watching-2))"></div><div class="m"><b>Watching</b><span class="var">--fsb-ov-watching-2</span><span class="lbl">#ffa500</span></div></div>
<div class="sw"><div class="fill" style="background:linear-gradient(90deg,var(--fsb-ov-calling-1),var(--fsb-ov-calling-2))"></div><div class="m"><b>Calling an app</b><span class="var">--fsb-ov-calling-1</span><span class="lbl">#8b5cf6</span></div></div>
</div>
<div class="grid">
<div class="sw"><div class="fill" style="background:var(--fsb-ov-done)"></div><div class="m"><b>Done</b><span class="var">--fsb-ov-done</span><span class="lbl">#34d399</span></div></div>
<div class="sw"><div class="fill" style="background:var(--fsb-ov-guarded)"></div><div class="m"><b>Blocked site</b><span class="var">--fsb-ov-guarded</span><span class="lbl">#f5a524</span></div></div>
<div class="sw"><div class="fill" style="background:var(--fsb-ov-crawl-fill)"></div><div class="m"><b>Crawl</b><span class="var">--fsb-ov-crawl</span><span class="lbl">#38bdf8</span></div></div>
<div class="sw"><div class="fill" style="background:var(--fsb-ov-card-surface);border-bottom:1px solid var(--fsb-ov-accent)"></div><div class="m"><b>Card</b><span class="var">--fsb-ov-card-surface</span><span class="lbl">#000000</span></div></div>
</div>
</body>
</html>
