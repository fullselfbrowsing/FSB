<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--primary); }
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{height:104px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-color);border-radius:var(--radius-md)}
</style>
</head>
<body>
<div class="grid">
<div class="tile" style="background:#000;color:#f1f5f9"><span translate="no" style="display:inline-block;line-height:1;font-size:2.1rem"><span style="display:inline-flex;align-items:baseline;letter-spacing:-.02em;font-family:var(--font-brand);line-height:1"><span style="font-weight:100">F</span><span style="font-weight:900">S</span><svg viewBox="-3 -3 78 103" aria-hidden="true" style="height:.74em;width:auto;fill:currentColor;display:inline-block;vertical-align:baseline;margin-left:.01em"><path d="M0 0 L40 0 C58 0 70 10 70 26 C70 38 62 46 50 49 C64 51 72 60 72 74 C72 90 60 100 40 100 L0 100 Z"></path></svg></span></span></div>
<div class="tile" style="background:#fff;color:#0f172a"><span translate="no" style="display:inline-block;line-height:1;font-size:2.1rem"><span style="display:inline-flex;align-items:baseline;letter-spacing:-.02em;font-family:var(--font-brand);line-height:1"><span style="font-weight:100">F</span><span style="font-weight:900">S</span><svg viewBox="-3 -3 78 103" aria-hidden="true" style="height:.74em;width:auto;fill:currentColor;display:inline-block;vertical-align:baseline;margin-left:.01em"><path d="M0 0 L40 0 C58 0 70 10 70 26 C70 38 62 46 50 49 C64 51 72 60 72 74 C72 90 60 100 40 100 L0 100 Z"></path></svg></span></span></div>
</div>
</body>
</html>
