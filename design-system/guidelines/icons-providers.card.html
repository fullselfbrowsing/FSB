<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--primary); }
.row3{display:flex;gap:10px;flex-wrap:wrap;padding:18px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-card)}
.p{display:flex;flex-direction:column;align-items:center;gap:8px;width:66px}
.p img{width:26px;height:26px;opacity:.9}
</style>
</head>
<body>
<div class="row3">
<div class="p"><img src="../assets/providers/claude.svg" alt="claude"><span class="lbl">claude</span></div><div class="p"><img src="../assets/providers/openai.svg" alt="openai"><span class="lbl">openai</span></div><div class="p"><img src="../assets/providers/cursor.svg" alt="cursor"><span class="lbl">cursor</span></div><div class="p"><img src="../assets/providers/vscode.svg" alt="vscode"><span class="lbl">vscode</span></div><div class="p"><img src="../assets/providers/windsurf.svg" alt="windsurf"><span class="lbl">windsurf</span></div><div class="p"><img src="../assets/providers/opencode.svg" alt="opencode"><span class="lbl">opencode</span></div><div class="p"><img src="../assets/providers/openrouter.svg" alt="openrouter"><span class="lbl">openrouter</span></div><div class="p"><img src="../assets/providers/all.svg" alt="all"><span class="lbl">all</span></div>
</div>
</body>
</html>
