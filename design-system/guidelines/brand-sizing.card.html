<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--primary); }
.row2{display:flex;align-items:flex-end;gap:36px;flex-wrap:wrap;padding:22px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-card);color:var(--text-primary)}
.it{display:flex;flex-direction:column;align-items:center;gap:9px}
</style>
</head>
<body>
<div class="row2">
<div class="it"><span translate="no" style="display:inline-block;line-height:1;font-size:1.5rem"><span style="display:inline-flex;align-items:baseline;letter-spacing:-.02em;font-family:var(--font-brand);line-height:1"><span style="font-weight:100">F</span><span style="font-weight:900">S</span><svg viewBox="-3 -3 78 103" aria-hidden="true" style="height:.74em;width:auto;fill:currentColor;display:inline-block;vertical-align:baseline;margin-left:.01em"><path d="M0 0 L40 0 C58 0 70 10 70 26 C70 38 62 46 50 49 C64 51 72 60 72 74 C72 90 60 100 40 100 L0 100 Z"></path></svg></span></span><span class="lbl">nav · 1.5rem</span></div>
<div class="it"><span translate="no" style="display:inline-block;line-height:1;font-size:1.32rem"><span style="display:inline-flex;align-items:baseline;letter-spacing:-.02em;font-family:var(--font-brand);line-height:1"><span style="font-weight:100">F</span><span style="font-weight:900">S</span><svg viewBox="-3 -3 78 103" aria-hidden="true" style="height:.74em;width:auto;fill:currentColor;display:inline-block;vertical-align:baseline;margin-left:.01em"><path d="M0 0 L40 0 C58 0 70 10 70 26 C70 38 62 46 50 49 C64 51 72 60 72 74 C72 90 60 100 40 100 L0 100 Z"></path></svg><span style="font-family:var(--font-mono);font-size:.27em;letter-spacing:.4em;color:var(--text-muted);margin-top:.2em;padding-left:.4em">▽X.Y.Z</span></span></span><span class="lbl">footer · 1.32rem + version</span></div>
<div class="it"><span style="font-family:var(--font-mono);font-size:.9rem;letter-spacing:.4em;color:var(--text-muted)" translate="no">▽X.Y.Z</span><span class="lbl">standalone tag</span></div>
</div>

</html>
