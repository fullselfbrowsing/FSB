<!-- @dsCard group="Spacing" viewport="700x165" subtitle="4px base, 8/12/16/24/32/48 in use" name="Spacing rhythm" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--primary); }
.scale{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:22px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-card)}
.it{display:flex;flex-direction:column;align-items:center;gap:9px}
.bx{background:var(--primary-gradient);border-radius:3px}
</style>
</head>
<body>
<div class="scale"><div class="it"><span class="bx" style="width:8px;height:8px"></span><span class="lbl">8</span></div><div class="it"><span class="bx" style="width:12px;height:12px"></span><span class="lbl">12</span></div><div class="it"><span class="bx" style="width:16px;height:16px"></span><span class="lbl">16</span></div><div class="it"><span class="bx" style="width:24px;height:24px"></span><span class="lbl">24</span></div><div class="it"><span class="bx" style="width:32px;height:32px"></span><span class="lbl">32</span></div><div class="it"><span class="bx" style="width:48px;height:48px"></span><span class="lbl">48</span></div></div>
</body>
</html>
