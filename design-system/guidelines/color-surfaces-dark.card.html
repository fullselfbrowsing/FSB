<!-- @dsCard group="Colors" viewport="700x190" subtitle="Default theme, near-black ramp" name="Surfaces — dark" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--primary); }
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border:1px solid var(--border-color);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-card)}
.fill{height:62px}
.m{padding:9px 11px;border-top:1px solid var(--border-color);display:flex;flex-direction:column;gap:2px}
.m b{font-size:.76rem;color:var(--text-primary);font-weight:600}
</style>
</head>
<body>
<div class="grid">
<div class="sw"><div class="fill" style="background:#000000"></div><div class="m"><b>Body</b><span class="var">--bg-body</span><span class="lbl">#000000</span></div></div>
<div class="sw"><div class="fill" style="background:#0a0a0a"></div><div class="m"><b>Card</b><span class="var">--bg-card</span><span class="lbl">#0a0a0a</span></div></div>
<div class="sw"><div class="fill" style="background:#141414"></div><div class="m"><b>Elevated</b><span class="var">--bg-elevated</span><span class="lbl">#141414</span></div></div>
<div class="sw"><div class="fill" style="background:repeating-linear-gradient(45deg,#1f1f1f 0 8px,#101010 8px 16px)"></div><div class="m"><b>Nav</b><span class="var">--bg-nav</span><span class="lbl">black @ 0.5 + blur</span></div></div>
</div>
</body>
</html>
