<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--primary); }
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
.t{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-card)}
.b{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--primary-wash);border-radius:var(--radius-sm);color:var(--primary);font-size:.9rem}
.n{font-family:var(--font-mono);font-size:.52rem;color:var(--text-muted)}
</style>
</head>
<body>
<div class="grid">
<div class="t"><span class="b"><i class="fa-solid fa-bolt"></i></span><span class="n">bolt</span></div><div class="t"><span class="b"><i class="fa-solid fa-hand-pointer"></i></span><span class="n">pointer</span></div><div class="t"><span class="b"><i class="fa-solid fa-bell"></i></span><span class="n">bell</span></div><div class="t"><span class="b"><i class="fa-solid fa-sitemap"></i></span><span class="n">sitemap</span></div><div class="t"><span class="b"><i class="fa-solid fa-gauge-high"></i></span><span class="n">gauge</span></div><div class="t"><span class="b"><i class="fa-solid fa-eye"></i></span><span class="n">eye</span></div><div class="t"><span class="b"><i class="fa-solid fa-compass"></i></span><span class="n">compass</span></div><div class="t"><span class="b"><i class="fa-solid fa-plug"></i></span><span class="n">plug</span></div><div class="t"><span class="b"><i class="fa-solid fa-tower-broadcast"></i></span><span class="n">broadcast</span></div><div class="t"><span class="b"><i class="fa-solid fa-database"></i></span><span class="n">database</span></div><div class="t"><span class="b"><i class="fa-solid fa-code"></i></span><span class="n">code</span></div><div class="t"><span class="b"><i class="fa-solid fa-play"></i></span><span class="n">play</span></div><div class="t"><span class="b"><i class="fa-solid fa-magnifying-glass"></i></span><span class="n">search</span></div><div class="t"><span class="b"><i class="fa-solid fa-check"></i></span><span class="n">check</span></div><div class="t"><span class="b"><i class="fa-regular fa-copy"></i></span><span class="n">copy</span></div><div class="t"><span class="b"><i class="fa-brands fa-github"></i></span><span class="n">github</span></div><div class="t"><span class="b"><i class="fa-brands fa-chrome"></i></span><span class="n">chrome</span></div><div class="t"><span class="b"><i class="fa-solid fa-cube"></i></span><span class="n">cube</span></div>
</div>
</body>
</html>
