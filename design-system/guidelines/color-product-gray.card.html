<!-- @dsCard group="Colors" viewport="700x110" subtitle="--fsb-gray-50 through 900" name="Warm gray ramp" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--primary); }
.ramp{display:flex;border:1px solid var(--border-color);border-radius:var(--radius-md);overflow:hidden}
.step{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--font-mono);font-size:.54rem}
</style>
</head>
<body>
<div class="ramp">
<span class="step" style="background:#faf8f6;color:#5f4f44">50</span><span class="step" style="background:#f5f1ed;color:#5f4f44">100</span><span class="step" style="background:#ede6df;color:#5f4f44">150</span><span class="step" style="background:#e2d8cf;color:#5f4f44">200</span><span class="step" style="background:#cdbfb2;color:#443832">300</span><span class="step" style="background:#a79383;color:#fff">400</span><span class="step" style="background:#7c6859;color:#fff">500</span><span class="step" style="background:#5f4f44;color:#fff">600</span><span class="step" style="background:#443832;color:#fff">700</span><span class="step" style="background:#2d2522;color:#fff">800</span><span class="step" style="background:#171312;color:#fff">900</span>
</div>
</body>
</html>
