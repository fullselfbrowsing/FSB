<!-- @dsCard group="Colors" viewport="700x330" subtitle="One orange, four transparency steps" name="Accent" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); }
.var { font-family: var(--font-mono); font-size: .6rem; color: var(--primary); }
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border:1px solid var(--border-color);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-card)}
.fill{height:62px}
.m{padding:9px 11px;border-top:1px solid var(--border-color);display:flex;flex-direction:column;gap:2px}
.m b{font-size:.76rem;color:var(--text-primary);font-weight:600}
</style>
</head>
<body>
<div class="grid">
<div class="sw"><div class="fill" style="background:#ff6b35"></div><div class="m"><b>Primary</b><span class="var">--primary</span><span class="lbl">#ff6b35</span></div></div>
<div class="sw"><div class="fill" style="background:#e55a2b"></div><div class="m"><b>Hover</b><span class="var">--primary-hover</span><span class="lbl">#e55a2b</span></div></div>
<div class="sw"><div class="fill" style="background:linear-gradient(135deg,#ff6b35,#ff8c42)"></div><div class="m"><b>Gradient</b><span class="var">--primary-gradient</span><span class="lbl">135deg → #ff8c42</span></div></div>
<div class="sw"><div class="fill" style="background:var(--primary-tint)"></div><div class="m"><b>Tint</b><span class="var">--primary-tint</span><span class="lbl">#ff8c42</span></div></div>
<div class="sw"><div class="fill" style="background:var(--primary-faint)"></div><div class="m"><b>Faint</b><span class="var">--primary-faint</span><span class="lbl">orange at 8%</span></div></div>
<div class="sw"><div class="fill" style="background:var(--primary-soft)"></div><div class="m"><b>Soft</b><span class="var">--primary-soft</span><span class="lbl">orange at 12%</span></div></div>
<div class="sw"><div class="fill" style="background:var(--primary-glow)"></div><div class="m"><b>Glow</b><span class="var">--primary-glow</span><span class="lbl">orange at 24%</span></div></div>
<div class="sw"><div class="fill" style="background:var(--primary-glow-strong)"></div><div class="m"><b>Glow strong</b><span class="var">--primary-glow-strong</span><span class="lbl">orange at 40%</span></div></div>
</div>
</body>
</html>
