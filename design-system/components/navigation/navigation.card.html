<!-- @dsCard group="Components" viewport="1200x460" subtitle="Fixed blurred nav bar and four-column footer" name="Navigation" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body { padding: 20px 22px; background: var(--bg-body); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 16px; }
.lbl { font-family: var(--font-mono); font-size: .6rem; color: var(--text-muted); letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* The bundle publishes one global namespace object; find it by a known export. */
function resolveNS(probe) {
  for (const k of Object.keys(window)) {
    const v = window[k];
    if (v && typeof v === 'object' && typeof v[probe] === 'function') return v;
  }
  return {};
}
const NS = resolveNS('NavBar');
const { FsbMark, VersionTag, Button, Badge, Card, SectionHeader, StatBlock, Field, Input, Textarea, Select, Toggle, Checkbox, SearchField, NavBar, Footer, Toast } = NS;

function Demo() {
  const links = [
    { label: 'Home', href: '#' }, { label: 'About', href: '#' }, { label: 'Agents', href: '#' },
    { label: 'Support', href: '#' }, { label: 'Privacy', href: '#' },
  ];
  return (
    <div className="col" style={{ gap: 24 }}>
      <div style={{ border: '1px solid var(--border-color)', borderRadius: 'var(--radius-md)', overflow: 'hidden' }}>
        <NavBar fixed={false} active="Home" links={links} />
      </div>
      <Footer
        version="\u25bdX.Y.Z"
        columns={[
          { title: 'Pages', links: [{ label: 'Home', href: '#' }, { label: 'About', href: '#' }, { label: 'Agents', href: '#' }] },
          { title: 'Project', links: [{ label: 'GitHub', href: '#' }, { label: 'Changelog', href: '#' }, { label: 'License', href: '#' }] },
          { title: 'Research', links: [{ label: 'Lattice', href: '#' }, { label: 'PhantomStream', href: '#' }, { label: 'Prometheus', href: '#' }] },
        ]}
        bottomLinks={[{ label: 'Privacy', href: '#' }, { label: 'Support', href: '#' }]}
      />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
