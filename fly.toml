app = 'fsb-server'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3847'
  DB_PATH = '/data/fsb-data.db'
  NODE_ENV = 'production'
  # Worldwide city-level IP->place dataset (DB-IP IP-to-City Lite, generated by
  # showcase/server/scripts/refresh-dbip-dataset.mjs): IPv4 + IPv6 range tables
  # and the place-centroid table. They live on the mounted /data volume (NOT
  # baked into the image) and are searched on disk, not loaded into memory.
  # Safe to set before the files exist: ip-geo.js degrades to 'unknown' until
  # they are uploaded; restart the machine after replacing a file so it is
  # reopened. See showcase/server/data/README.md.
  DBIP_DATASET_PATH = '/data/dbip-city/dbip-city-lite.csv'
  DBIP_IPV6_DATASET_PATH = '/data/dbip-city/dbip-city-lite.ipv6.csv'
  DBIP_PLACES_DATASET_PATH = '/data/dbip-city/dbip-city-lite.places.csv'

[http_service]
  internal_port = 3847
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'fsb_data'
  destination = '/data'
