<!doctype html><html><body>
<div id="editor" tabindex="0"></div>
<script>
// Like Monaco 0.57, this editor takes input through EditContext on a plain
// div, so the page has no text field for a DOM lookup to find.
const editor = { text: 'hello', start: 0, end: 0 };
const view = document.getElementById('editor');
view.editContext = new EditContext();
const render = () => { view.textContent = editor.text; };
view.addEventListener('keydown', (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === 'a') {
    event.preventDefault();
    editor.start = 0;
    editor.end = editor.text.length;
  } else if ((event.metaKey && event.key === 'ArrowDown') || (event.ctrlKey && event.key === 'End')) {
    event.preventDefault();
    editor.start = editor.end = editor.text.length;
  }
});
view.editContext.addEventListener('textupdate', (event) => {
  editor.text = editor.text.slice(0, editor.start) + event.text + editor.text.slice(editor.end);
  editor.start = editor.end = editor.start + event.text.length;
  render();
});
render();
</script>
</body></html>
