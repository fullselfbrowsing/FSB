<!doctype html>
<html lang="en" data-bench-app="search-detail">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search results - Trailhead Outfitters</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light; --ink: #1c2230; --muted: #5b6475; --line: #d9dde5; --accent: #2457c5; --bg: #f5f6f8; --card: #fff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 980px; margin: 0 auto; padding: 20px 24px 32px; }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .btn { font: inherit; padding: 6px 14px; border: 1px solid #b8bfcc; border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }
  .search { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
  .search label { display: block; font-weight: 600; margin-bottom: 4px; }
  .search input { font: inherit; width: 22rem; max-width: 100%; padding: 6px 8px; border: 1px solid #b8bfcc; border-radius: 6px; }
  .muted { color: var(--muted); }
  .results { list-style: none; margin: 0; padding: 0; }
  .results li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .results .name { font-weight: 600; }
  .results .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <p><a href="index.html">Trailhead Outfitters home</a></p>
  <section class="panel" aria-label="Product search">
    <form class="search" action="results.html" method="get" role="search">
      <div>
        <label for="q">Search products</label>
        <input id="q" name="q" type="search" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn primary" type="submit">Search</button>
    </form>
  </section>
  <section class="panel" aria-labelledby="results-heading">
    <h1 id="results-heading">Search results</h1>
    <p id="results-summary" class="muted"></p>
    <ul id="results" class="results"></ul>
  </section>
</main>
<script src="../_shared/bench.js"></script>
<script src="catalog.js"></script>
<script>
  (() => {
    'use strict';
    const query = (new URLSearchParams(location.search).get('q') || '').trim();
    document.getElementById('q').value = query;
    const heading = document.getElementById('results-heading');
    const summary = document.getElementById('results-summary');
    const list = document.getElementById('results');
    if (!query) {
      summary.textContent = 'Enter a search term to find products.';
      return;
    }
    heading.textContent = `Results for "${query}"`;
    document.title = `${query} - Search results - Trailhead Outfitters`;
    const matches = searchCatalog(query);
    summary.textContent = matches.length === 1 ? '1 product found.' : `${matches.length} products found.`;
    for (const item of matches) {
      const li = document.createElement('li');
      const left = document.createElement('div');
      const link = document.createElement('a');
      link.className = 'name';
      link.href = `detail.html?${new URLSearchParams({ sku: item.sku, q: query })}`;
      link.textContent = item.name;
      const category = document.createElement('div');
      category.className = 'muted';
      category.textContent = item.category;
      left.append(link, category);
      const price = document.createElement('span');
      price.className = 'price';
      price.textContent = formatPrice(item.price);
      li.append(left, price);
      list.append(li);
    }
  })();
</script>
</body>
</html>
