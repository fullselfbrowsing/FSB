<!doctype html>
<html lang="en" data-bench-app="paginate-find">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen catalog</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light; --ink: #1c2230; --muted: #5b6475; --line: #d9dde5; --accent: #2457c5; --bg: #f5f6f8; --card: #fff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 820px; margin: 0 auto; padding: 20px 24px 32px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; margin-bottom: 14px; }
  .btn { font: inherit; padding: 4px 12px; border: 1px solid #b8bfcc; border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .status { margin: 0 0 12px; color: #1f7a3a; font-weight: 600; }
  .error { margin: 0 0 12px; color: #b42318; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .visually-hidden { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .pager { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .pager .disabled { color: #9aa1ae; border-color: var(--line); cursor: default; }
  .items { list-style: none; margin: 0; padding: 0; }
  .items li { display: grid; grid-template-columns: 1fr max-content max-content max-content; align-items: center; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .items li:last-child { border-bottom: 0; }
  .items .name { font-weight: 600; }
  .items .id { color: var(--muted); font-size: 0.85rem; }
  .items .price { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Kitchen catalog</h1>
  <nav class="pager" aria-label="Catalog pages">
    <span id="prev-slot"></span>
    <span id="page-label" aria-live="polite"></span>
    <span id="next-slot"></span>
  </nav>
  <p id="add-status" class="status" role="status" hidden>Added <span id="added-name"></span> to your cart. Items in cart: <output data-bench-marker="cart-count"></output></p>
  <p id="add-error" class="error" role="alert" hidden></p>
  <section class="panel" aria-labelledby="page-label">
    <ul id="items" class="items"></ul>
  </section>
</main>
<script src="../_shared/bench.js"></script>
<script src="items.js"></script>
<script>
  (() => {
    'use strict';
    const pageCount = Math.ceil(ITEMS.length / PAGE_SIZE);
    const raw = new URLSearchParams(location.search).get('page');
    const page = /^\d+$/.test(raw || '') ? Math.min(Math.max(Number(raw), 1), pageCount) : 1;
    const status = document.getElementById('add-status');
    const error = document.getElementById('add-error');
    let cartCount = 0;
    let busy = false;

    function pagerControl(label, target, rel) {
      if (target < 1 || target > pageCount) {
        const span = document.createElement('span');
        span.className = 'btn disabled';
        span.setAttribute('aria-disabled', 'true');
        span.textContent = label;
        return span;
      }
      const link = document.createElement('a');
      link.className = 'btn';
      link.href = `?page=${target}`;
      link.rel = rel;
      link.textContent = label;
      return link;
    }

    document.getElementById('prev-slot').replaceWith(pagerControl('Previous', page - 1, 'prev'));
    document.getElementById('next-slot').replaceWith(pagerControl('Next', page + 1, 'next'));
    document.getElementById('page-label').textContent = `Page ${page} of ${pageCount}`;
    document.title = `Kitchen catalog - page ${page} of ${pageCount}`;

    const list = document.getElementById('items');
    for (const item of ITEMS.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE)) {
      const li = document.createElement('li');
      li.dataset.itemId = item.id;
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;
      const id = document.createElement('span');
      id.className = 'id';
      id.textContent = item.id;
      const price = document.createElement('span');
      price.className = 'price';
      price.textContent = `$${item.price.toFixed(2)}`;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn';
      button.append('Add to cart');
      const context = document.createElement('span');
      context.className = 'visually-hidden';
      context.textContent = `: ${item.name}`;
      button.append(context);
      let added = false;
      button.addEventListener('click', async () => {
        if (busy || added) return;
        busy = true;
        button.disabled = true;
        error.hidden = true;
        try {
          await benchPost('add', { itemId: item.id });
          added = true;
          cartCount += 1;
          button.firstChild.textContent = 'Added';
          setView({ page: String(page), view: 'added' });
          document.getElementById('added-name').textContent = item.name;
          setMarker('cart-count', String(cartCount));
          status.hidden = false;
        } catch {
          error.textContent = 'The item could not be added. Try again.';
          error.hidden = false;
        } finally {
          busy = false;
          button.disabled = added;
        }
      });
      li.append(name, id, price, button);
      list.append(li);
    }
  })();
</script>
</body>
</html>
