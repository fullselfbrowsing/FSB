<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title translate="no">FSB</title>
<link rel="stylesheet" href="credential-sheet.css">
</head>
<body>
<main id="sheet" class="os-pad" hidden>
  <section id="modeType">
    <p class="os-q" data-i18n="entry_vault_sheet_sign_in">Sign in</p>
    <p class="os-site" id="siteTypeRow"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg><span id="siteType" translate="no"></span></p>
    <div class="cx-frame">
      <div class="cx-in" id="userBox"><input id="user" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="2048" placeholder="Email or username" aria-label="Email or username" data-i18n-attr="placeholder:entry_vault_sheet_user,aria-label:entry_vault_sheet_user"></div>
      <div class="cx-in" id="pwBox"><input id="pw" type="password" autocomplete="off" maxlength="2048" placeholder="Password" aria-label="Password" data-i18n-attr="placeholder:shell_password,aria-label:shell_password"><button class="cx-eye" id="eye" type="button" aria-label="Show password" data-i18n-attr="aria-label:panel_6aeaa6a53d"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="2.8"></circle></svg></button></div>
      <div class="cx-save" id="saveRow"><span data-i18n="copy_264681c742">Save to 1Password</span><button class="cx-tg on" id="saveToggle" type="button" aria-pressed="true" aria-label="Save to 1Password" data-i18n-attr="aria-label:copy_264681c742"></button></div>
      <p class="cx-dim" id="noSave" hidden data-i18n="entry_vault_sheet_no_save">Not saved · no vault set for new logins</p>
      <button class="cx-pause" id="pause" type="button" hidden><b data-i18n="entry_vault_sheet_paused">Paused</b> <span data-i18n="entry_vault_sheet_paused_hint">· click to keep typing</span></button>
    </div>
    <p class="cx-warn" id="covered" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 15.5H3z"></path><path d="M12 10v4.2M12 17h.01"></path></svg><span data-i18n="entry_vault_sheet_covered">Partly covered by the page</span></p>
    <div class="os-acts"><button class="os-btn" id="cancelType" type="button" data-i18n="shell_cancel">Cancel</button><button class="os-btn go" id="signIn" type="button" disabled data-i18n="entry_vault_sheet_sign_in">Sign in</button></div>
    <button class="cx-alt" id="toAdd" type="button" data-i18n="entry_vault_sheet_use_1p">Use 1Password instead</button>
  </section>
  <section id="modeAdd" hidden>
    <p class="os-q" data-i18n="entry_vault_sheet_add_title">Add it in 1Password</p>
    <p class="os-site" id="siteAddRow"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg><span id="siteAdd" translate="no"></span></p>
    <p class="cx-note" data-i18n="entry_vault_sheet_add_note">Save a login for this site in 1Password, then continue.</p>
    <p class="cx-warn" id="stillMissing" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 15.5H3z"></path><path d="M12 10v4.2M12 17h.01"></path></svg><span data-i18n="entry_vault_sheet_still_missing">Still nothing saved for this site.</span></p>
    <div class="os-acts"><button class="os-btn" id="cancelAdd" type="button" data-i18n="shell_cancel">Cancel</button><button class="os-btn go" id="continueAdd" type="button" data-i18n="entry_continue">Continue</button></div>
    <button class="cx-alt" id="toType" type="button" data-i18n="entry_vault_sheet_type_instead">Type it here instead</button>
  </section>
</main>
<script src="../utils/ui-locale.js"></script>
<script src="credential-sheet.js"></script>
</body>
</html>
