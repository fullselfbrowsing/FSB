<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="copy_34c70e4722">FSB - Onboarding</title>
  <link rel="stylesheet" href="../assets/onboarding/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <main class="ob ob3" data-screen-label="FSB Onboarding">
    <div class="ob-glow" aria-hidden="true"></div>
    <div class="ob3-bloom" aria-hidden="true"></div>
    <header class="ob-top">
      <div class="ob-top-l">
        <span class="fsb-mark" translate="no" aria-label="FSB">
          <span class="fsb-row">
            <span class="fsb-f">F</span><span class="fsb-s">S</span><svg class="fsb-b" viewBox="-3 -3 78 103" aria-hidden="true"><path d="M0 0 L40 0 C58 0 70 10 70 26 C70 38 62 46 50 49 C64 51 72 60 72 74 C72 90 60 100 40 100 L0 100 Z"></path></svg>
          </span>
        </span>
        <span class="ob-top-tag" data-i18n="entry_onboarding_tag">Onboarding</span>
      </div>
      <div class="ob-top-r">
        <span class="ob-ver" id="obStepLabel" translate="no">Step 1 of 5</span>
      </div>
    </header>

    <!-- Every step is a plane on the z axis: the page script fills the planes and the depth engine flies between them. -->
    <div class="ob3-stage" id="obStage" data-depth-stage tabindex="0" role="region" aria-label="FSB onboarding. Scroll, swipe or use the arrow keys to move between steps." data-i18n-attr="aria-label:entry_stage_aria"></div>

    <nav class="fsb-depth-rail" id="obNodes" aria-label="Onboarding steps" data-i18n-attr="aria-label:entry_rail_aria"></nav>

    <div class="ob3-cue" id="obCue" aria-hidden="true">
      <span class="ob3-cue-text" id="obCueText"></span>
      <span class="ob3-cue-line"><span class="ob3-cue-fill" id="obTrackFill"></span></span>
    </div>

    <div class="ob-toast" id="obToast" role="status" aria-live="polite">
      <i class="fa-solid fa-circle-check"></i>
      <span id="obToastMsg"></span>
    </div>
  </main>
  <script src="../utils/ui-locale.js"></script>
  <script src="../utils/copy-exact.js"></script>
  <script src="../ai/model-discovery.js"></script>
  <script src="onboarding-depth.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
