<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Bootstrap metadata stays brand-only because index.html is not extracted
       by Angular i18n. Each route replaces it with localized metadata.
       The i18n markers are disabled rather than declared: they produced no
       trans-unit (index.html is not an Angular template) but did ship as dead
       attributes in every prerendered page, in every locale. -->
  <!-- eslint-disable-next-line @angular-eslint/template/i18n -->
  <title>FSB</title>
  <!-- eslint-disable-next-line @angular-eslint/template/i18n -->
  <meta name="description" content="FSB">
  <base href="/">
  <!-- eslint-disable-next-line @angular-eslint/template/i18n -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Prerender-safe theme bootstrap: guard requires `typeof window.matchMedia !== 'function'` (PITFALLS.md P1, D-20) -->
  <script>
    (function initShowcaseTheme() {
      if (typeof window === 'undefined') return;
      if (typeof window.matchMedia !== 'function') return;
      if (!window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Without JavaScript the depth pages (layout/depth) cannot move between their
       planes, so they fall back to one ordinary scrolling column. -->
  <noscript>
    <style>
      html:has(.fsb-depth), html:has(.fsb-depth) body { height: auto !important; overflow: auto !important; }
      .fsb-depth { position: static !important; overflow: visible !important; }
      .fsb-depth-layer { position: relative !important; inset: auto !important; min-height: 100vh; visibility: visible !important; pointer-events: auto !important; }
      .fsb-depth-layer[data-scroll] { overflow: visible !important; -webkit-mask-image: none; mask-image: none; }
      .fsb-depth-rail, .fsb-depth-ambient { display: none !important; }
    </style>
  </noscript>

  <link rel="icon" type="image/png" href="/assets/icon48.png">
  <!-- Organization JSON-LD (LD-01, D-10..D-12). Inherited by every prerendered route via index.html template. Payload is hand-authored single-line strict JSON; no field contains '<' so no \u003c escape pass is needed. Pattern: PITFALLS.md P4. Threat: T-LD-01 (XSS via JSON-LD injection). -->
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","@id":"https://full-selfbrowsing.com/#org","name":"FSB","alternateName":["Full Self-Browsing","Full Self Browsing"],"url":"https://full-selfbrowsing.com","logo":"https://full-selfbrowsing.com/assets/fsb_logo_dark.png","sameAs":["https://github.com/fullselfbrowsing/FSB","https://www.youtube.com/@parzival5707"]}</script>
</head>
<body>
  <app-root></app-root>
  <!-- Dashboard CDN libraries (html5-qrcode + lz-string) load lazily on /dashboard
       via DashboardPageComponent.loadDashboardCdnScripts() — they were previously
       global, costing ~105 KB unused JS on every non-dashboard route. -->
  <!-- Dashboard runtime state helpers (preview surface, remote control, task recovery derivation) -->
  <script src="assets/dashboard-runtime-state.js"></script>
  <script src="assets/phantom-stream-viewer.js"></script>
</body>
</html>
