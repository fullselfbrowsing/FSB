<div class="fsb-end" #end>
  <div class="fsb-end-mark" data-di="0.7" aria-hidden="true">
    <div class="fsb-end-float" style="--d: -14">
      <span class="fsb-mark">
        <span class="fsb-row">
          <span class="fsb-f"></span>
          <span class="fsb-s"></span>
          <svg class="fsb-b" viewBox="-3 -3 78 103" aria-hidden="true">
            <path d="M0 0 L40 0 C58 0 70 10 70 26 C70 38 62 46 50 49 C64 51 72 60 72 74 C72 90 60 100 40 100 L0 100 Z"></path>
          </svg>
        </span>
      </span>
    </div>
  </div>

  <nav class="fsb-end-groups" i18n-aria-label="@@depth.end.aria" aria-label="Site index">
    <div class="fsb-end-group" data-di="0.1">
      <div class="fsb-end-float" style="--d: 16">
        <h2 class="fsb-end-label" i18n="@@shell.footer.col.pages.title">Pages</h2>
        <span class="fsb-end-line" aria-hidden="true"></span>
        <ul class="fsb-end-list">
          <li><a routerLink="/" routerLinkActive="is-current" [routerLinkActiveOptions]="{exact: true}" [ariaCurrentWhenActive]="'page'"><span i18n="@@shell.footer.col.pages.home">Home</span></a></li>
          <li><a routerLink="/about" routerLinkActive="is-current" [ariaCurrentWhenActive]="'page'"><span i18n="@@shell.footer.col.pages.about">About</span></a></li>
          <li><a routerLink="/dashboard" routerLinkActive="is-current" [ariaCurrentWhenActive]="'page'"><span i18n="@@shell.footer.col.pages.dashboard">Dashboard</span></a></li>
          <li><a routerLink="/agents" routerLinkActive="is-current" [ariaCurrentWhenActive]="'page'"><span i18n="@@shell.footer.col.pages.agents">Agents</span></a></li>
          <li><a routerLink="/privacy" routerLinkActive="is-current" [ariaCurrentWhenActive]="'page'"><span i18n="@@shell.footer.col.pages.privacy">Privacy</span></a></li>
          <li><a routerLink="/support" routerLinkActive="is-current" [ariaCurrentWhenActive]="'page'"><span i18n="@@shell.footer.col.pages.support">Support</span></a></li>
        </ul>
      </div>
    </div>

    <div class="fsb-end-group" data-di="0.2">
      <div class="fsb-end-float" style="--d: 26">
        <h2 class="fsb-end-label" i18n="@@shell.footer.col.project.title">Project</h2>
        <span class="fsb-end-line" aria-hidden="true"></span>
        <ul class="fsb-end-list">
          <li><a href="https://github.com/fullselfbrowsing/FSB" target="_blank" rel="noopener" [attr.translate]="'no'"><span i18n="@@shell.footer.project.github">GitHub</span><i class="fa-solid fa-arrow-up-right-from-square fsb-end-ext" aria-hidden="true"></i></a></li>
          <li><a href="https://github.com/fullselfbrowsing/FSB/issues" target="_blank" rel="noopener" [attr.translate]="'no'"><span i18n="@@shell.footer.project.issues">Issues</span><i class="fa-solid fa-arrow-up-right-from-square fsb-end-ext" aria-hidden="true"></i></a></li>
          <li><a routerLink="/release-notes"><span i18n="@@shell.footer.project.releaseNotes">Release notes</span></a></li>
          <li><a href="https://github.com/fullselfbrowsing/FSB/blob/main/LICENSE" target="_blank" rel="noopener"><span i18n="@@shell.footer.project.license">MIT License</span><i class="fa-solid fa-arrow-up-right-from-square fsb-end-ext" aria-hidden="true"></i></a></li>
          <li><a routerLink="/stats"><span i18n="@@shell.footer.project.stats">Stats</span></a></li>
        </ul>
      </div>
    </div>

    <div class="fsb-end-group" data-di="0.3">
      <div class="fsb-end-float" style="--d: 20">
        <h2 class="fsb-end-label" i18n="@@shell.footer.col.research.title">Research</h2>
        <span class="fsb-end-line" aria-hidden="true"></span>
        <ul class="fsb-end-list">
          <li><a routerLink="/lattice" [attr.translate]="'no'"><span i18n="@@shell.footer.research.lattice">Lattice</span></a></li>
          <li><a routerLink="/concierge" [attr.translate]="'no'"><span i18n="@@shell.footer.research.concierge">Concierge</span></a></li>
          <li><a routerLink="/phantom-stream" [attr.translate]="'no'"><span i18n="@@shell.footer.research.phantomStream">PhantomStream</span></a></li>
          <li><a routerLink="/prometheus" [attr.translate]="'no'"><span i18n="@@shell.footer.research.prometheus">Prometheus</span></a></li>
        </ul>
      </div>
    </div>

    <div class="fsb-end-group" data-di="0.4">
      <div class="fsb-end-float" style="--d: 30">
        <h2 class="fsb-end-label" i18n="@@shell.footer.col.community.title">Community</h2>
        <span class="fsb-end-line" aria-hidden="true"></span>
        <ul class="fsb-end-list">
          <li><a href="https://x.com/fsb0804" target="_blank" rel="noopener" i18n-aria-label="@@shell.footer.community.x" aria-label="X" [attr.translate]="'no'"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i><i class="fa-solid fa-arrow-up-right-from-square fsb-end-ext" aria-hidden="true"></i></a></li>
          <li><a href="https://discord.gg/xRbj6JQpY" target="_blank" rel="noopener" [attr.translate]="'no'"><span i18n="@@shell.footer.community.discord">Discord</span><i class="fa-solid fa-arrow-up-right-from-square fsb-end-ext" aria-hidden="true"></i></a></li>
          <li><a routerLink="/sitemaps" [attr.translate]="'no'"><span i18n="@@shell.footer.community.sitemaps">Sitemaps</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="fsb-end-meta" data-di="0.5">
    <p class="footer-version" i18n="@@shell.footer.bottom.version"><span class="version-tag" [attr.translate]="'no'">▽{{ appVersion }}</span></p>
    <app-language-picker [mode]="'text'"></app-language-picker>
  </div>
</div>
