name: chrome-extension

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'scripts/package-extension.mjs'
      - 'scripts/sync-product-version.mjs'
      - 'scripts/validate-extension.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'mcp/**'
      - '.github/workflows/chrome-extension.yml'
      - '.github/workflows/npm-publish.yml'
    tags:
      - 'extension-v*'
  workflow_dispatch:

concurrency:
  group: chrome-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: validate, test, and package extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.extension-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify independent product versions
        run: npm run version:check

      - name: Install exact dependency trees
        run: |
          npm ci --no-audit --no-fund
          npm --prefix mcp ci --no-audit --no-fund
          npm --prefix showcase/server ci --no-audit --no-fund
          npm --prefix showcase/angular ci --no-audit --no-fund

      - name: Validate extension
        run: npm run validate:extension

      - name: Run extension and bridge tests
        run: npm test

      - name: Package Chrome extension
        run: npm run package:extension

      - name: Read canonical extension version
        id: extension-version
        run: |
          node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./extension/manifest.json').version + String.fromCharCode(10))"

      - name: Bind tag to canonical extension version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: test "$GITHUB_REF_NAME" = "extension-v${{ steps.extension-version.outputs.version }}"

      - name: Require the tagged commit to be on main
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: |
          git fetch origin main --no-tags
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$release_commit" origin/main

      - name: Verify version-bound extension archive
        run: test -f "dist/fsb-extension-v${{ steps.extension-version.outputs.version }}.zip"

      - name: Upload version-bound extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsb-extension-v${{ steps.extension-version.outputs.version }}
          path: dist/fsb-extension-v${{ steps.extension-version.outputs.version }}.zip
          if-no-files-found: error

      - name: Create extension GitHub release
        if: startsWith(github.ref, 'refs/tags/extension-v')
        uses: softprops/action-gh-release@v2
        with:
          name: FSB extension v${{ steps.extension-version.outputs.version }}
          body: |
            FSB Chrome extension v${{ steps.extension-version.outputs.version }}.

            Install from the Chrome Web Store when available, or use the attached package for a supervised manual installation.
          files: dist/fsb-extension-v${{ steps.extension-version.outputs.version }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-cws:
    name: publish extension to Chrome Web Store
    needs: package
    if: startsWith(github.ref, 'refs/tags/extension-v') && vars.CWS_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download version-bound extension artifact
        uses: actions/download-artifact@v4
        with:
          name: fsb-extension-v${{ needs.package.outputs.version }}
          path: dist

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: dist/fsb-extension-v${{ needs.package.outputs.version }}.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true
